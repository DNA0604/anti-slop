  <style>
    body {
      font-family: Arial, sans-serif;

    }

      background: #fdecea;
      color: #b42318;

<style id="flat-dashboard-theme">
/* Shared flat dashboard skin. Embedded in every Apps Script HTML page. */
:root { --ink:#1c3035; --muted:#607378; --line:#e0e8e7; --blue:#087f70; --bg:#f4f7f6; --nav-width:232px; --accent:#087f70; }
html {scroll-behavior:smooth; scrollbar-gutter:stable}
body.flat-dashboard {font:14px/1.6 'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--ink); margin:0; padding:0 0 0 var(--nav-width); transition:padding .18s ease}
.flat-dashboard *, .flat-dashboard *::before, .flat-dashboard *::after {box-sizing:border-box}
.flat-dashboard button,.flat-dashboard input,.flat-dashboard select,.flat-dashboard textarea {font:inherit}
.flat-dashboard :is(button,a,input,select,textarea,summary):focus-visible {outline:3px solid #e2a72f; outline-offset:3px}
.flat-dashboard a {color:#076f62}
.flat-dashboard button {cursor:pointer}
.flat-dashboard button:disabled {opacity:.48; cursor:not-allowed}
.flat-dashboard .hidden {display:none!important}
.flat-dashboard .dash-sidebar {position:fixed; inset:0 auto 0 0; width:var(--nav-width); background:#fff; border-right:1px solid var(--line); z-index:60; display:flex; flex-direction:column; padding:30px 18px 20px; transition:transform .18s ease; text-align:left}
.dash-logo {display:flex; align-items:center; gap:11px; padding:0 10px 29px; border-bottom:1px solid var(--line)}
.dash-logo-mark {display:grid; place-items:center; width:38px; height:38px; background:#087f70; color:white; border-radius:8px; flex-shrink:0}
.dash-logo strong {font-size:19px; letter-spacing:-.7px; color:#183c38}
.dash-logo small {display:block; font-size:10px; color:var(--muted); letter-spacing:1.15px; text-transform:uppercase}
.dash-nav-label {font-size:10px; font-weight:700; color:#5d7468; letter-spacing:1.6px; margin:27px 12px 12px}
.dash-nav {display:grid; gap:7px}
.dash-nav a {display:flex; gap:12px; align-items:center; color:#536765; padding:12px; border-radius:6px; text-decoration:none; font-size:13px; font-weight:600; border:1px solid transparent}
.dash-nav a:hover {background:#f1f6f4; color:#076f62}
.dash-nav a[aria-current=page] {background:#e5f3ee; color:#076f62; border-color:#d0e9de}
.dash-nav a svg {flex-shrink:0; width:19px; height:19px}

.dash-sidebar-bottom {margin-top:auto; padding:24px 10px 0; font-size:11px; color:var(--muted)}
.dash-sidebar-bottom strong {display:block; color:#365b54; font-size:12px; margin-bottom:4px}

.flat-dashboard .dash-toolbar {height:72px; padding:0 34px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid var(--line); background:#fff}
.dash-toolbar-start,.dash-toolbar-end {display:flex; align-items:center; gap:15px; min-width:0}
.dash-breadcrumb {font-size:12px; color:var(--muted)}
.dash-breadcrumb b {font-weight:600; color:#2a4741}
.flat-dashboard .dash-icon-btn {display:grid; place-items:center; border:1px solid var(--line); color:#42635c; background:white; width:36px; height:36px; min-height:36px; padding:7px; border-radius:6px; margin:0; flex-shrink:0}
.flat-dashboard .dash-icon-btn:hover {background:#edf5f0}
.dash-icon-btn svg {width:19px; height:19px}
.dash-date {font-size:12px; color:var(--muted)}
.dash-avatar {width:34px; height:34px; border-radius:50%; background:#e5f3ee; color:#087164; display:grid; place-items:center}
.flat-dashboard > header:not(.dash-toolbar) {margin:0; padding:30px 34px 6px; background:transparent; border:0}

<body class="flat-dashboard public-page"><div class="public-brand"><span class="dash-logo-mark"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h6l2 3 2-3h6v14h-6l-2 2-2-2H4z"/><path d="M12 8v13M7 10h2M15 10h2"/></svg></span> Pelatihan<span style="font-weight:400;color:#678275"> / Absensi</span></div>
  <div class="container">
    <h2>Absensi Pelatihan</h2>

    <p>
      Sistem sedang memeriksa QR Code Anda.
    </p>

    <div id="status" class="status" role="status" aria-live="polite">
      Memvalidasi token...
    </div>

    <div id="formIdentitas" style="display:none; margin-top:24px;">

      <label for="inputNama" style="display:block; text-align:left; margin-bottom:8px;">
        Nama Peserta
      </label>

      <input
        type="text"
        id="inputNama"
        placeholder="Ketik nama Anda..."
        autocomplete="off"
        style="width:100%; padding:12px; box-sizing:border-box; border:1px solid #cbd5e1; border-radius:8px;">

      <div id="hasilPencarian" aria-live="polite" style="margin-top:12px; text-align:left;">
      </div>

      <button
        type="button"
        id="btnKonfirmasi"
        disabled
        style="width:100%; margin-top:16px; padding:12px; background:#2563eb; color:white; border:none; border-radius:8px;">
        Konfirmasi Kehadiran
      </button>

    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("inputNama")
        .addEventListener("input", cariNamaPeserta);

      document.getElementById("btnKonfirmasi").addEventListener("click", konfirmasiKehadiran);
      mulaiValidasi();
    });

    let permintaanAktif = null;
    let sedangMenyimpan = false;
    let absensiSelesai = false;

    function konfirmasiKehadiran() {
      if (sedangMenyimpan || absensiSelesai || !pesertaDipilih) return;
      if (!permintaanAktif) {
        const angka = new Uint32Array(4);
        crypto.getRandomValues(angka);
        permintaanAktif = {
          token: tokenAbsensi,
          id_peserta: pesertaDipilih.id_peserta,
          id_permintaan: Array.from(angka, n => n.toString(16).padStart(8, "0")).join("")
        };
      }
      sedangMenyimpan = true;
      const tombol = document.getElementById("btnKonfirmasi");
      tombol.disabled = true;
      tombol.textContent = "Menyimpan...";
      document.getElementById("inputNama").disabled = true;
      document.querySelectorAll("#hasilPencarian button").forEach(b => b.disabled = true);
      google.script.run
        .withSuccessHandler(function(hasil) {
          sedangMenyimpan = false;
          if (!hasil || !hasil.sukses) {
            tampilkanStatus(hasil && hasil.pesan || "Absensi belum berhasil dicatat.", false);
            tombol.textContent = "Permintaan selesai — hubungi petugas";
            return;
          }
          absensiSelesai = true;
          tampilkanStatus(hasil.pesan + " Waktu: " + new Date(hasil.waktu_scan).toLocaleString("id-ID", {timeZone:"Asia/Jakarta"}) + " WIB. Status: " + hasil.status_kehadiran.replace(/_/g, " ") + ".", true);
          tombol.textContent = "Absensi Tercatat";
        })
        .withFailureHandler(function(error) {
          sedangMenyimpan = false;
          tampilkanStatus("Penyimpanan belum terkonfirmasi. Klik Coba Lagi dengan data yang sama. Jika tetap gagal, hubungi petugas. " + (error && error.message || ""), false);
          tombol.disabled = false;
          tombol.textContent = "Coba Lagi";
        })
        .simpanAbsensiPeserta(permintaanAktif);
    }

    let tokenAbsensi = "";
    let pesertaDipilih = null;
    let urutanPencarian = 0;

    function tampilkanStatus(pesan, berhasil) {
      const elemen = document.getElementById("status");
      elemen.textContent = pesan;
      elemen.className = "status " + (berhasil ? "success" : "error");
    }

    function mulaiValidasi() {
      google.script.url.getLocation(function(location) {
        const token =
          location &&
          location.parameter &&
          location.parameter.absen
            ? String(location.parameter.absen).trim()
            : "";
        
        tokenAbsensi = token;

        if (!token) {
          tampilkanStatus("Token QR tidak ditemukan.", false);
          return;
        }

        google.script.run
          .withSuccessHandler(function(hasil) {
            if (!hasil || !hasil.valid) {
              tampilkanStatus("QR Code tidak valid atau sudah kedaluwarsa.", false);
              return;
            }

            tampilkanStatus(
              "QR Code valid. Sesi: " +
              hasil.id_sesi +
              " | Jenis: " +
              hasil.jenis_scan,
              true
            );

            document.getElementById("formIdentitas").style.display = "block";
          })
          .withFailureHandler(function(error) {
            tampilkanStatus("Terjadi kesalahan saat memvalidasi QR Code.", false);
            console.error(error);
          })
          .validasiTokenQR(token);
      });
    }

    function cariNamaPeserta() {
      if (permintaanAktif || sedangMenyimpan || absensiSelesai) return;
      const kataKunci = document.getElementById("inputNama").value.trim();
      const hasil = document.getElementById("hasilPencarian");
      const tombol = document.getElementById("btnKonfirmasi");

      pesertaDipilih = null;
      tombol.disabled = true;
      hasil.replaceChildren();

      const nomorPencarian = ++urutanPencarian;

      if (kataKunci.length < 2) {
        hasil.textContent = "Ketik minimal 2 karakter nama.";
        return;
      }

      hasil.textContent = "Mencari peserta...";

      google.script.run
        .withSuccessHandler(function(response) {
          if (nomorPencarian !== urutanPencarian || permintaanAktif) return;

          hasil.replaceChildren();

          if (!response || response.sukses !== true) {
            hasil.textContent = "Pencarian gagal.";
            return;
          }

          if (!response.peserta.length) {
            hasil.textContent = "Nama peserta tidak ditemukan.";
            return;
          }

          response.peserta.forEach(function(peserta) {
            const pilihan = document.createElement("button");

            pilihan.type = "button";
            pilihan.textContent =
              peserta.nama_pegawai +
              " — " +
              peserta.unit_kerja;

            pilihan.style.cssText =
              "display:block;width:100%;padding:12px;" +
              "margin-bottom:6px;text-align:left;" +
              "background:#f1f5f9;border:1px solid #cbd5e1;" +
              "border-radius:8px;cursor:pointer;";

            pilihan.addEventListener("click", function() {
              pesertaDipilih = peserta;

              hasil.querySelectorAll("button").forEach(btn => {
                btn.style.background = "#f1f5f9";
                btn.style.borderColor = "#cbd5e1";
              });

              pilihan.style.background = "#dbeafe";
              pilihan.style.borderColor = "#2563eb";

              tombol.disabled = false;
            });

            hasil.appendChild(pilihan);
          });
        })
        .withFailureHandler(function(error) {
          if (nomorPencarian !== urutanPencarian || permintaanAktif) return;
          hasil.textContent = "Terjadi kesalahan saat mencari peserta.";
          console.error(error);
        })
        .cariPesertaAbsensi(tokenAbsensi, kataKunci);
    }
  </script>
